<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ⚠️ SECURITY: Load local config (credentials) before CPA module -->
<script src="config.local.js"></script>
<!-- 🔒 SECURITY: DOMPurify for XSS prevention -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <nav>
        <a data-route="/" onclick="location.hash='#/'">Dashboard</a>
        <a data-route="/admin" onclick="location.hash='#/admin'">Question Bank</a>
    </nav>
    <div class="topbar-actions">
        <div class="user-chip" id="userChip" style="display:none;" title="Switch reviewer"></div>
        <button id="darkModeBtn" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
    </div>
</div>

<div id="app"></div>

<footer>© 2026 CPA Board Reviewer · Not by might, but by faithful effort</footer>

<script>
/* ============================================================
   CPA Board Reviewer — Data Layer ("Backend")
   Questions and results now live in Supabase (shared, cross-device),
   with a small local-only settings key for UI prefs like dark mode.
   This file is the single source of truth for reading/writing
   questions & results, so
   every page (admin, subject, exam, dashboard) talks to the
   SAME api instead of touching localStorage directly.
   ============================================================ */

const CPA = (() => {

    const KEYS = {
        SETTINGS: 'cpa_v1_settings' // local UI prefs only (dark mode) — everything else lives in Supabase now
    };

    // ---- Supabase client + auth ----------------------------------------
    // Load credentials from window.CONFIG (set via config.local.js for local dev)
    // Fallback to empty values to prevent crashes, but will show auth error
    const supabaseUrl = window.CONFIG?.SUPABASE_URL || '';
    const supabaseKey = window.CONFIG?.SUPABASE_ANON_KEY || '';

    if (!supabaseUrl || !supabaseKey) {
        console.error(
            '[CPA] ⚠️ Supabase credentials missing!\n' +
            'For local development: Create config.local.js with:\n' +
            '  window.CONFIG = {\n' +
            '    SUPABASE_URL: "YOUR_SUPABASE_URL",\n' +
            '    SUPABASE_ANON_KEY: "YOUR_ANON_KEY"\n' +
            '  };\n' +
            'For GitHub Pages: See the SECURITY.md file for GitHub Actions setup.\n'
        );
    }

    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let _user = null;      // { id, email } once logged in
    let _profile = null;   // { id, display_name, is_admin }

    async function signUp(email, password){
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if(error) throw error;
        return data;
    }
    async function signIn(email, password){
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
        _user = data.user;
        await _loadProfile();
        return data;
    }
    async function signOut(){
        await supabaseClient.auth.signOut();
        _user = null;
        _profile = null;
    }
    async function _loadProfile(){
        if(!_user){ _profile = null; return; }
        const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', _user.id).single();
        if(error){ console.error('Failed to load profile', error); _profile = null; return; }
        _profile = data;
    }
    // Call once on page load: restores an existing session (if any) and
    // pre-loads the question bank + this user's results.
    async function initSession(){
        const { data } = await supabaseClient.auth.getSession();
        _user = data.session ? data.session.user : null;
        if(_user) await _loadProfile();
        await loadTopics();
        await loadQuestions();
        if(_user) await loadResults();
    }
    function getUser(){ return _user; }
    function getDisplayName(){ return _profile && _profile.display_name ? _profile.display_name : (_user ? _user.email : ''); }
    function isAdmin(){ return !!(_profile && _profile.is_admin); }

    // ---- Topics (per-subject, admin-managed) ---------------------------
    // Requires a `topics` table in Supabase — see migration.sql. Each topic
    // just needs an id/subject/name/sort_order; questions and results keep
    // using their existing `level` column to store a topic's id.
    let _topicsCache = [];
    function _rowToTopic(row){
        return { id: row.id, subject: row.subject, name: row.name, sortOrder: row.sort_order, createdAt: row.created_at };
    }
    async function loadTopics(){
        const { data, error } = await supabaseClient.from('topics').select('*').order('sort_order', { ascending:true });
        if(error){ console.error('Failed to load topics', error); _topicsCache = []; return; }
        _topicsCache = data.map(_rowToTopic);
    }
    function getAllTopics(){ return _topicsCache; }
    function getTopics(subject){
        return _topicsCache.filter(t => t.subject === subject).sort((a,b) => a.sortOrder - b.sortOrder);
    }
    function getTopic(id){ return _topicsCache.find(t => t.id === id) || null; }
    async function addTopic(subject, name){
        name = (name || '').trim();
        if(!name) throw new Error('Topic name is required.');
        const existing = getTopics(subject);
        const sortOrder = existing.length ? Math.max(...existing.map(t => t.sortOrder)) + 1 : 0;
        const row = {
            id: 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8),
            subject, name, sort_order: sortOrder
        };
        const { data, error } = await supabaseClient.from('topics').insert(row).select().single();
        if(error) throw error;
        const record = _rowToTopic(data);
        _topicsCache.push(record);
        return record;
    }
    async function renameTopic(id, name){
        name = (name || '').trim();
        if(!name) throw new Error('Topic name is required.');
        const { data, error } = await supabaseClient.from('topics').update({ name }).eq('id', id).select().single();
        if(error) throw error;
        const record = _rowToTopic(data);
        const idx = _topicsCache.findIndex(t => t.id === id);
        if(idx !== -1) _topicsCache[idx] = record;
        return record;
    }
    // Deleting a topic also removes every question filed under it, since an
    // orphaned topic id in the question bank would be unreachable from the UI.
    async function deleteTopic(id){
        const qs = getAllQuestions().filter(q => q.level === id);
        for(const q of qs) await deleteQuestion(q.id);
        const { error } = await supabaseClient.from('topics').delete().eq('id', id);
        if(error) throw error;
        _topicsCache = _topicsCache.filter(t => t.id !== id);
    }
    // Mastery unlocks once every topic in the subject has been passed at
    // least once (best score >= MASTERY_PASS_THRESHOLD). A subject with no
    // topics yet can't unlock Mastery.
    function isMasteryUnlocked(subject){
        const topics = getTopics(subject);
        if(!topics.length) return false;
        return topics.every(t => {
            const best = getBestScore(subject, t.id);
            return best !== null && best >= MASTERY_PASS_THRESHOLD;
        });
    }

    // ---- Subject catalogue -----------------------------------------
    // Subjects are still fixed (the six CPALE subjects). Topics inside each
    // subject are no longer fixed tiers — they're admin-defined and live in
    // the `topics` table (see loadTopics/addTopic/etc below).
    const SUBJECTS = [
        { id:'FAR',       name:'FAR',       full:'Financial Accounting & Reporting',       icon:'fa-calculator' },
        { id:'AFAR',      name:'AFAR',      full:'Advanced Financial Accounting & Reporting', icon:'fa-chart-line' },
        { id:'MS',        name:'MS',        full:'Management Services',                    icon:'fa-briefcase' },
        { id:'AUDITING',  name:'Auditing',  full:'Auditing Theory & Problems',              icon:'fa-magnifying-glass-chart' },
        { id:'TAXATION',  name:'Taxation',  full:'Tax Concepts & Computations',             icon:'fa-receipt', featured:true },
        { id:'RFBT',      name:'RFBT',      full:'Regulatory Framework & Business Law',     icon:'fa-scale-balanced' }
    ];

    // The Mastery Exam is a computed pseudo-topic (not a row in the topics
    // table): it pulls every question from every topic in the subject, and
    // only unlocks once each real topic has been passed at least once.
    const MASTERY_TOPIC_ID = '__mastery__';
    const MASTERY_PASS_THRESHOLD = 75;

    // ---- low-level storage helpers ----------------------------------
    function _read(key, fallback){
        try{
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        }catch(e){
            console.error('CPA storage read failed for', key, e);
            return fallback;
        }
    }
    function _write(key, value){
        try{
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        }catch(e){
            console.error('CPA storage write failed for', key, e);
            return false;
        }
    }
    function _uid(){
        return 'q_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
    }

    // ---- Questions ---------------------------------------------------
    // Kept in an in-memory cache so the many render functions elsewhere in
    // the app can keep reading questions synchronously. The cache is loaded
    // from Supabase on startup (loadQuestions) and refreshed after any write.
    let _questionsCache = [];

    function _rowToQuestion(row){
        return {
            id: row.id,
            subject: row.subject,
            level: row.level,
            type: row.type,
            question: row.question,
            choices: row.choices || [],
            correctIndex: row.correct_index,
            answer: row.answer || '',
            solution: row.solution || '',
            explanation: row.explanation || '',
            createdAt: row.created_at,
            updatedAt: row.updated_at
        };
    }
    async function loadQuestions(){
        const { data, error } = await supabaseClient.from('questions').select('*').order('created_at', { ascending:true });
        if(error){ console.error('Failed to load questions', error); _questionsCache = []; return; }
        _questionsCache = data.map(_rowToQuestion);
    }
    function getAllQuestions(){
        return _questionsCache;
    }
    function getQuestions(subject, level){
        return getAllQuestions().filter(q => q.subject === subject && (!level || q.level === level));
    }
    function getQuestion(id){
        return getAllQuestions().find(q => q.id === id) || null;
    }
    async function addQuestion(q){
        const row = {
            subject: q.subject, level: q.level, type: q.type || 'mcq',
            question: q.question, choices: q.choices || [], correct_index: q.correctIndex,
            answer: q.answer || '', solution: q.solution || '', explanation: q.explanation || ''
        };
        const { data, error } = await supabaseClient.from('questions').insert(row).select().single();
        if(error) throw error;
        const record = _rowToQuestion(data);
        _questionsCache.push(record);
        return record;
    }
    async function updateQuestion(id, patch){
        const row = {};
        if(patch.subject !== undefined) row.subject = patch.subject;
        if(patch.level !== undefined) row.level = patch.level;
        if(patch.type !== undefined) row.type = patch.type;
        if(patch.question !== undefined) row.question = patch.question;
        if(patch.choices !== undefined) row.choices = patch.choices;
        if(patch.correctIndex !== undefined) row.correct_index = patch.correctIndex;
        if(patch.answer !== undefined) row.answer = patch.answer;
        if(patch.solution !== undefined) row.solution = patch.solution;
        if(patch.explanation !== undefined) row.explanation = patch.explanation;
        row.updated_at = new Date().toISOString();
        const { data, error } = await supabaseClient.from('questions').update(row).eq('id', id).select().single();
        if(error) throw error;
        const record = _rowToQuestion(data);
        const idx = _questionsCache.findIndex(x => x.id === id);
        if(idx !== -1) _questionsCache[idx] = record;
        return record;
    }
    async function deleteQuestion(id){
        const { error } = await supabaseClient.from('questions').delete().eq('id', id);
        if(error) throw error;
        _questionsCache = _questionsCache.filter(q => q.id !== id);
    }
    function getQuestionCounts(subject){
        const qs = getAllQuestions().filter(q => q.subject === subject);
        const counts = {};
        getTopics(subject).forEach(t => { counts[t.id] = qs.filter(q => q.level === t.id).length; });
        return counts;
    }

    // ---- Bulk import ---------------------------------------------------
    // Accepts an array of "loose" row objects (already parsed from CSV or
    // JSON) and turns them into real question records in one shot, so the
    // admin never has to use the one-by-one modal for a big batch.
    // Each row may provide: type, question, choiceA/choiceB/choiceC/choiceD
    // (or a `choices` array), correct (letter A-D, 1-based or 0-based number),
    // answer, solution, explanation, subject, level.
    // `defaults.subject` / `defaults.level` are used for any row that omits them.
    async function bulkAddQuestions(rows, defaults){
        defaults = defaults || {};
        const added = [];
        const errors = [];

        for(let i = 0; i < rows.length; i++){
            const raw = rows[i];
            const rowNum = i + 2; // +2 assumes a header row at line 1 (CSV-friendly numbering)
            try{
                const record = _normalizeBulkRow(raw, defaults);
                added.push(await addQuestion(record));
            }catch(e){
                errors.push({ row: rowNum, message: e.message, raw });
            }
        }

        return { added, errors };
    }

    function _normalizeBulkRow(raw, defaults){
        const get = (obj, keys) => {
            for(const k of keys){
                if(obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return String(obj[k]).trim();
            }
            return '';
        };

        const subject = (get(raw, ['subject', 'Subject', 'SUBJECT']) || defaults.subject || '').toUpperCase();
        // "level" is kept as the column/field name for backward compatibility,
        // but it now holds a topic id or topic name rather than easy/hard/etc.
        const levelRaw = (get(raw, ['topic', 'Topic', 'TOPIC', 'level', 'Level', 'LEVEL']) || defaults.level || '');
        const type = (get(raw, ['type', 'Type', 'TYPE']) || defaults.type || 'mcq').toLowerCase();
        const question = get(raw, ['question', 'Question', 'QUESTION', 'q']);
        const explanation = get(raw, ['explanation', 'Explanation']);

        if(!SUBJECTS.some(s => s.id === subject)){
            throw new Error(`Unknown subject "${subject || '(blank)'}". Use one of: ${SUBJECTS.map(s=>s.id).join(', ')}.`);
        }
        const subjectTopics = getTopics(subject);
        const matchedTopic = subjectTopics.find(t => t.id === levelRaw) ||
            subjectTopics.find(t => t.name.toLowerCase() === levelRaw.toLowerCase());
        if(!matchedTopic){
            throw new Error(`Unknown topic "${levelRaw || '(blank)'}" for ${subject}. Add the topic first from the admin panel, then use its exact name here.`);
        }
        const level = matchedTopic.id;
        if(!question){
            throw new Error('Missing question text.');
        }
        if(type !== 'mcq' && type !== 'problem'){
            throw new Error(`Unknown type "${type}". Use "mcq" or "problem".`);
        }

        if(type === 'mcq'){
            let choices = [];
            if(Array.isArray(raw.choices) && raw.choices.length){
                choices = raw.choices.map(c => String(c).trim());
            } else {
                choices = [
                    get(raw, ['choiceA', 'choice_a', 'A', 'optionA', 'option1', 'choice1']),
                    get(raw, ['choiceB', 'choice_b', 'B', 'optionB', 'option2', 'choice2']),
                    get(raw, ['choiceC', 'choice_c', 'C', 'optionC', 'option3', 'choice3']),
                    get(raw, ['choiceD', 'choice_d', 'D', 'optionD', 'option4', 'choice4'])
                ];
            }
            choices = choices.filter(c => c !== '');
            if(choices.length < 2){
                throw new Error('MCQ needs at least 2 non-empty choices.');
            }

            const correctRaw = get(raw, ['correct', 'Correct', 'correctIndex', 'answer', 'Answer']);
            if(correctRaw === ''){
                throw new Error('Missing correct answer (letter A-D or choice number).');
            }
            let correctIndex;
            if(/^[A-Za-z]$/.test(correctRaw)){
                correctIndex = correctRaw.toUpperCase().charCodeAt(0) - 65;
            } else if(/^\d+$/.test(correctRaw)){
                const n = parseInt(correctRaw, 10);
                // Accept both 1-based (spreadsheet-friendly) and 0-based input.
                correctIndex = (n >= 1 && n <= choices.length) ? n - 1 : n;
            } else {
                // Correct answer given as the literal choice text.
                correctIndex = choices.findIndex(c => c.toLowerCase() === correctRaw.toLowerCase());
            }
            if(correctIndex < 0 || correctIndex >= choices.length){
                throw new Error(`Correct answer "${correctRaw}" doesn't match any of the ${choices.length} choices.`);
            }

            return { subject, level, type:'mcq', question, choices, correctIndex, explanation };
        } else {
            const answer = get(raw, ['answer', 'Answer', 'correct', 'Correct']);
            const solution = get(raw, ['solution', 'Solution']);
            if(!answer){
                throw new Error('Missing correct final answer for problem-solving question.');
            }
            return { subject, level, type:'problem', question, answer, solution, explanation };
        }
    }

    // Minimal CSV parser — handles quoted fields, embedded commas, and
    // escaped quotes (""), which is all typical spreadsheet exports need.
    function parseCSV(text){
        const rows = [];
        let row = [], field = '', inQuotes = false;
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        for(let i = 0; i < text.length; i++){
            const c = text[i], next = text[i+1];
            if(inQuotes){
                if(c === '"' && next === '"'){ field += '"'; i++; }
                else if(c === '"'){ inQuotes = false; }
                else field += c;
            } else {
                if(c === '"') inQuotes = true;
                else if(c === ','){ row.push(field); field = ''; }
                else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
                else field += c;
            }
        }
        row.push(field);
        rows.push(row);
        while(rows.length && rows[rows.length-1].every(f => f.trim() === '')) rows.pop();

        if(!rows.length) return [];
        const headers = rows[0].map(h => h.trim());
        return rows.slice(1).map(r => {
            const obj = {};
            headers.forEach((h, idx) => { obj[h] = r[idx] !== undefined ? r[idx] : ''; });
            return obj;
        });
    }

    // ---- Exam session (in-memory helper, not persisted until submit) --
    function shuffle(arr){
        const a = arr.slice();
        for(let i = a.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    // Every topic exam (and Mastery) is uncapped now — it simply uses every
    // question that's been loaded into that topic (or, for Mastery, every
    // question across every topic in the subject).
    function buildExam(subject, topicId){
        if(topicId === MASTERY_TOPIC_ID) return buildMasteryExam(subject);
        const bank = getQuestions(subject, topicId);
        const picked = shuffle(bank);
        return { questions: picked, target: picked.length, available: bank.length, unlimited: true };
    }
    function buildMasteryExam(subject){
        const bank = getAllQuestions().filter(q => q.subject === subject);
        const picked = shuffle(bank);
        return { questions: picked, target: picked.length, available: bank.length, unlimited: true };
    }

    // ---- Results / stats ----------------------------------------------
    // The DB (via RLS) only ever returns the logged-in user's own results,
    // so there's no need to filter by "reviewer" anymore — the cache IS
    // this user's results.
    let _resultsCache = [];

    function _rowToResult(row){
        return {
            id: row.id,
            subject: row.subject,
            level: row.level,
            score: row.score,
            total: row.total,
            percentage: row.percentage,
            durationSec: row.duration_sec,
            date: row.date
        };
    }
    async function loadResults(){
        if(!_user){ _resultsCache = []; return; }
        const { data, error } = await supabaseClient.from('results').select('*').eq('user_id', _user.id);
        if(error){ console.error('Failed to load results', error); _resultsCache = []; return; }
        _resultsCache = data.map(_rowToResult);
    }
    function getAllResults(){
        return _resultsCache;
    }
    async function saveResult(result){
        if(!_user) throw new Error('You must be signed in to save a result.');
        const row = {
            user_id: _user.id,
            subject: result.subject,
            level: result.level,
            score: result.score,
            total: result.total,
            percentage: result.percentage,
            duration_sec: result.durationSec
        };
        const { data, error } = await supabaseClient.from('results').insert(row).select().single();
        if(error) throw error;
        const record = _rowToResult(data);
        _resultsCache.push(record);
        return record;
    }
    function getResults(subject, level){
        return getAllResults().filter(r =>
            (!subject || r.subject === subject) &&
            (!level || r.level === level)
        );
    }
    function getBestScore(subject, level){
        const rs = getResults(subject, level);
        if(!rs.length) return null;
        return Math.max(...rs.map(r => r.percentage));
    }
    function getStats(){
        const all = getAllResults();
        const examsTaken = all.length;
        const avg = examsTaken ? Math.round(all.reduce((a,r) => a + r.percentage, 0) / examsTaken) : 0;
        const highest = examsTaken ? Math.max(...all.map(r => r.percentage)) : 0;
        return { examsTaken, avg, highest };
    }

    // ---- Detailed progress helpers -------------------------------------
    function _reviewerResults(){
        return getAllResults();
    }
    // Best score + attempt count per subject/level, plus a per-subject average
    // across whichever tiers have been attempted at least once.
    function getSubjectBreakdown(){
        const results = _reviewerResults();
        return SUBJECTS.map(s => {
            const topics = getTopics(s.id);
            const levels = {};
            topics.forEach(t => {
                const tResults = results.filter(r => r.subject === s.id && r.level === t.id);
                levels[t.id] = {
                    name: t.name,
                    best: tResults.length ? Math.max(...tResults.map(r => r.percentage)) : null,
                    attempts: tResults.length
                };
            });
            const masteryResults = results.filter(r => r.subject === s.id && r.level === MASTERY_TOPIC_ID);
            const masteryBest = masteryResults.length ? Math.max(...masteryResults.map(r => r.percentage)) : null;
            const bests = topics.map(t => levels[t.id].best).filter(b => b !== null);
            const avg = bests.length ? Math.round(bests.reduce((a,b) => a+b, 0) / bests.length) : null;
            const totalAttempts = topics.reduce((sum, t) => sum + levels[t.id].attempts, 0) + masteryResults.length;
            return { subject: s, topics, levels, masteryBest, masteryAttempts: masteryResults.length, avg, totalAttempts, masteryUnlocked: isMasteryUnlocked(s.id) };
        });
    }
    // Most recent exam attempts, newest first.
    function getRecentResults(limit){
        return _reviewerResults()
            .slice()
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .slice(0, limit || 10);
    }
    // Subject/level tiers whose best score is still below the passing mark.
    function getWeakAreas(threshold){
        threshold = threshold === undefined ? 75 : threshold;
        const results = _reviewerResults();
        const weak = [];
        SUBJECTS.forEach(s => {
            getTopics(s.id).forEach(t => {
                const tResults = results.filter(r => r.subject === s.id && r.level === t.id);
                if(!tResults.length) return;
                const best = Math.max(...tResults.map(r => r.percentage));
                if(best < threshold) weak.push({ subject: s, level: { id:t.id, label:t.name }, best });
            });
        });
        return weak.sort((a, b) => a.best - b.best);
    }
    // All attempts in chronological order, for plotting a trend line.
    function getTrendData(){
        return _reviewerResults().slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    }
    // Clears this user's saved exam results/stats in Supabase. Leaves the
    // question bank and every other user's results untouched.
    async function resetProgress(){
        if(!_user) return;
        const { error } = await supabaseClient.from('results').delete().eq('user_id', _user.id);
        if(error) throw error;
        _resultsCache = [];
    }

    // ---- Import / export (backup) --------------------------------------
    function exportData(){
        return JSON.stringify({
            topics:getAllTopics(),
            questions:getAllQuestions(),
            results:getAllResults(),
            exportedAt:new Date().toISOString(),
            version:2
        }, null, 2);
    }
    // Import a JSON backup. Topics/questions get inserted into Supabase
    // (admin-only, enforced by RLS); "replace" first deletes every existing
    // question (topics are matched by subject+name and only added if missing,
    // never deleted, so nothing else built on top of them breaks).
    async function importData(json, mode){
        let parsed;
        try{ parsed = JSON.parse(json); } catch(e){ throw new Error('That file isn\'t valid JSON.'); }
        const incomingTopics = Array.isArray(parsed.topics) ? parsed.topics : [];
        const incomingQ = Array.isArray(parsed.questions) ? parsed.questions : [];

        for(const t of incomingTopics){
            if(!t || !t.subject || !t.name) continue;
            const exists = getTopics(t.subject).some(existing => existing.name === t.name);
            if(!exists) await addTopic(t.subject, t.name);
        }

        if(mode === 'replace'){
            const existing = getAllQuestions();
            for(const q of existing) await deleteQuestion(q.id);
        }
        const existingIds = new Set(mode === 'replace' ? [] : getAllQuestions().map(q => q.id));
        for(const q of incomingQ){
            if(existingIds.has(q.id)) continue; // skip duplicates on merge
            await addQuestion(q);
        }
        // Note: results are per-user and tied to your own account, so
        // imported results aren't restored here — only topics + question bank are.
    }

    // ---- Dark mode (shared across pages, still just a local UI pref) --
    function getDarkMode(){ return _read(KEYS.SETTINGS, {}).dark === true; }
    function setDarkMode(val){
        const s = _read(KEYS.SETTINGS, {});
        s.dark = val;
        _write(KEYS.SETTINGS, s);
    }
    function initDarkMode(){
        if(getDarkMode()) document.body.classList.add('dark');
        const btn = document.getElementById('darkModeBtn');
        if(!btn) return;
        const icon = btn.querySelector('i');
        const sync = () => { if(icon) icon.className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon'; };
        sync();
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            setDarkMode(document.body.classList.contains('dark'));
            sync();
        });
    }

    return {
        SUBJECTS, MASTERY_TOPIC_ID, MASTERY_PASS_THRESHOLD,
        loadTopics, getAllTopics, getTopics, getTopic, addTopic, renameTopic, deleteTopic, isMasteryUnlocked,
        getAllQuestions, getQuestions, getQuestion, addQuestion, updateQuestion, deleteQuestion, getQuestionCounts,
        bulkAddQuestions, parseCSV,
        buildExam, buildMasteryExam,
        getAllResults, saveResult, getResults, getBestScore, getStats,
        getSubjectBreakdown, getRecentResults, getWeakAreas, getTrendData, resetProgress,
        exportData, importData,
        initDarkMode,
        initSession, signUp, signIn, signOut, getUser, getDisplayName, isAdmin,
        loadQuestions, loadResults
    };
})();

</script>
<script>
/* ============================================================
   🔒 SECURITY: XSS Prevention Utilities
   Sanitization helpers for innerHTML assignments with user data
   ============================================================ */

// Sanitize text for safe text-only display (no HTML)
function sanitizeText(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.textContent; // Extract as plain text
}

// Sanitize and render HTML (for formatted question text, explanations)
function sanitizeHTML(html) {
    if (!window.DOMPurify) {
        console.warn('[SECURITY] DOMPurify not loaded, returning plain text');
        return sanitizeText(html);
    }
    return window.DOMPurify.sanitize(html, {
        ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'br', 'p', 'div', 'span', 'ul', 'ol', 'li', 'code', 'pre'],
        ALLOWED_ATTR: ['class', 'id']
    });
}

// Safe template literal rendering with text content
function safeHTML(strings, ...values) {
    let result = '';
    for (let i = 0; i < strings.length; i++) {
        result += strings[i];
        if (i < values.length) {
            // Escape any interpolated values for safe HTML insertion
            const value = values[i];
            if (typeof value === 'string') {
                result += sanitizeText(value);
            } else {
                result += value;
            }
        }
    }
    return result;
}

/* ================= AUTH GATE (sign up / log in, email + password) ================= */

// Turns Supabase's raw error/edge-case messages into copy a reviewer can
// actually act on, instead of surfacing internal auth error strings.
function friendlyAuthError(error){
    const msg = (error && error.message) || '';
    const lower = msg.toLowerCase();
    if(lower.includes('already registered') || lower.includes('already exists') || lower.includes('user already registered')){
        return 'An account with this email already exists. Try logging in instead.';
    }
    if(lower.includes('invalid login credentials') || lower.includes('invalid email or password')){
        return 'Incorrect email or password. Please double-check and try again.';
    }
    if(lower.includes('email not confirmed')){
        return 'Please confirm your email address before logging in — check your inbox for the confirmation link.';
    }
    if(lower.includes('password should be at least') || lower.includes('password is too short')){
        return 'Password must be at least 6 characters long.';
    }
    if(lower.includes('unable to validate email') || lower.includes('invalid email')){
        return 'That doesn\'t look like a valid email address. Please double-check it.';
    }
    if(lower.includes('rate limit')){
        return 'Too many attempts in a short time. Please wait a moment and try again.';
    }
    if(lower.includes('network') || lower.includes('fetch')){
        return 'Network error — please check your connection and try again.';
    }
    return msg || 'Something went wrong. Please try again.';
}

function renderAuthGate(onDone){
    let mode = 'login'; // 'login' | 'signup'

    function draw(){
        app.innerHTML = `
            <div class="auth-shell">
                <div class="auth-card">
                    <div class="seal-lg"><i class="fa-solid fa-scale-balanced"></i></div>
                    <h2>${mode === 'login' ? 'Welcome Back' : 'Create Your Account'}</h2>
                    <p>${mode === 'login' ? 'Log in to access your question bank and saved progress.' : 'Sign up to start tracking your CPALE review progress.'}</p>
                    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
                    <div class="password-field" style="margin-top:10px;">
                        <input type="password" id="authPassword" placeholder="Password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}">
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" tabindex="-1" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="auth-error" id="authError"></div>
                    <button class="btn btn-primary" id="authSubmitBtn" style="margin-top:14px;">
                        <i class="fa-solid fa-arrow-right"></i> ${mode === 'login' ? 'Log In' : 'Sign Up'}
                    </button>
                    <div class="auth-switch">
                        ${mode === 'login'
                            ? `Don't have an account? <a id="switchModeLink">Sign up</a>`
                            : `Already have an account? <a id="switchModeLink">Log in</a>`}
                    </div>
                </div>
            </div>`;

        const emailInput = document.getElementById('authEmail');
        const passInput = document.getElementById('authPassword');
        const err = document.getElementById('authError');
        const submitBtn = document.getElementById('authSubmitBtn');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        // Password show/hide toggle
        toggleBtn.addEventListener('click', () => {
            const willShow = passInput.type === 'password';
            passInput.type = willShow ? 'text' : 'password';
            toggleBtn.querySelector('i').className = willShow ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            toggleBtn.setAttribute('aria-label', willShow ? 'Hide password' : 'Show password');
            passInput.focus();
        });

        const submit = async () => {
            const email = emailInput.value.trim();
            const password = passInput.value;
            if(!email || !password){ err.style.color = ''; err.textContent = 'Please enter both email and password.'; return; }
            if(password.length < 6){ err.style.color = ''; err.textContent = 'Password must be at least 6 characters.'; return; }
            submitBtn.disabled = true;
            err.textContent = '';
            try{
                if(mode === 'signup'){
                    const data = await CPA.signUp(email, password);
                    // Supabase quietly "succeeds" (no error) when signing up an
                    // email that's already registered, returning a user object
                    // with an empty identities array instead of throwing. Catch
                    // that case here so we don't tell them to "check their email"
                    // for an account that already exists.
                    const alreadyExists = data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;
                    if(alreadyExists){
                        submitBtn.disabled = false;
                        err.style.color = '';
                        err.textContent = 'An account with this email already exists. Try logging in instead.';
                        return;
                    }
                    // If email confirmation is required, signUp won't return an
                    // active session — send them to log in once confirmed.
                    err.style.color = 'var(--good)';
                    err.textContent = 'Account created! Check your email to confirm, then log in.';
                    mode = 'login';
                    submitBtn.disabled = false;
                    setTimeout(draw, 1400);
                    return;
                } else {
                    await CPA.signIn(email, password);
                    await CPA.loadResults();
                    onDone();
                }
            }catch(e){
                submitBtn.disabled = false;
                err.style.color = '';
                err.textContent = friendlyAuthError(e);
            }
        };
        submitBtn.addEventListener('click', submit);
        passInput.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
        document.getElementById('switchModeLink').addEventListener('click', () => { mode = mode === 'login' ? 'signup' : 'login'; draw(); });
        emailInput.focus();
    }
    draw();
}

// ---- Detailed progress render helpers ----
function scoreClass(pct){ return pct >= 75 ? 'good' : pct >= 60 ? 'warn' : 'bad'; }
function scoreColor(pct){ return pct >= 75 ? 'var(--good)' : pct >= 60 ? 'var(--brass)' : 'var(--bad)'; }

function buildTrendSVG(results){
    if(results.length < 2){
        return `<div class="trend-empty"><i class="fa-solid fa-chart-line" style="font-size:26px;color:var(--brass);margin-bottom:10px;display:block;"></i>Take a couple more exams to see your score trend over time.</div>`;
    }
    const w = 680, h = 200, padL = 34, padR = 14, padT = 16, padB = 12;
    const innerW = w - padL - padR, innerH = h - padT - padB;
    const n = results.length;
    const pts = results.map((r, i) => ({
        x: padL + (n === 1 ? 0 : (i / (n - 1)) * innerW),
        y: padT + innerH - (r.percentage / 100) * innerH,
        pct: r.percentage
    }));
    const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaPath = linePath + ` L${pts[pts.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
    const gridLines = [0, 25, 50, 75, 100].map(v => {
        const y = padT + innerH - (v / 100) * innerH;
        return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--paper-line)" stroke-width="1"/>
                <text x="${padL-8}" y="${(y+4).toFixed(1)}" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--ink-faint)" text-anchor="end">${v}</text>`;
    }).join('');
    const passY = padT + innerH - (75 / 100) * innerH;
    const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${scoreColor(p.pct)}" stroke="var(--card)" stroke-width="2"><title>${p.pct}%</title></circle>`).join('');

    return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="font-family:var(--font-display); font-size:18px;">Score Trend</h3>
            <span style="font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);">Last ${n} exams</span>
        </div>
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
            ${gridLines}
            <line x1="${padL}" y1="${passY.toFixed(1)}" x2="${w-padR}" y2="${passY.toFixed(1)}" stroke="var(--brass)" stroke-width="1" stroke-dasharray="4 4"/>
            <path d="${areaPath}" fill="var(--navy-700)" opacity="0.08"/>
            <path d="${linePath}" fill="none" stroke="var(--navy-700)" stroke-width="2.5"/>
            ${dots}
        </svg>
        <div style="font-size:11.5px; color:var(--ink-faint); margin-top:6px;">Dashed line marks the 75% passing mark.</div>`;
}

function buildWeakAreasHTML(weak){
    if(!weak.length) return '';
    return `
        <div class="weak-areas-card">
            <h3><i class="fa-solid fa-triangle-exclamation"></i> Needs Review</h3>
            <p>These topics are still below the 75% passing mark, based on your best attempt so far. Tap one to jump back in.</p>
            <div class="weak-chip-list">
                ${weak.map(w => `<span class="weak-chip" data-subject="${sanitizeText(w.subject.id)}" data-level="${sanitizeText(w.level.id)}">${sanitizeText(w.subject.id)} · ${sanitizeText(w.level.label)} · ${w.best}%</span>`).join('')}
            </div>
        </div>`;
}

function buildSubjectBreakdownHTML(breakdown){
    return breakdown.map(b => {
        const avgClass = b.avg === null ? 'none' : scoreClass(b.avg);
        const avgLabel = b.avg === null ? 'No attempts' : b.avg + '%';
        const levelsHtml = b.topics.map(t => {
            const lv = b.levels[t.id];
            const pct = lv.best === null ? 0 : lv.best;
            const barColor = lv.best === null ? 'var(--paper-line)' : scoreColor(lv.best);
            const scoreLabel = lv.best === null ? 'Not tried' : lv.best + '%';
            return `<div class="sb-level-row">
                <span class="sb-level-label">${sanitizeText(t.name)}</span>
                <div class="sb-level-bar"><div class="sb-level-fill" style="width:${pct}%; background:${barColor};"></div></div>
                <span class="sb-level-score">${scoreLabel}</span>
            </div>`;
        }).join('');
        const masteryPct = b.masteryBest === null ? 0 : b.masteryBest;
        const masteryColor = b.masteryBest === null ? 'var(--paper-line)' : scoreColor(b.masteryBest);
        const masteryLabel = !b.masteryUnlocked ? 'Locked' : (b.masteryBest === null ? 'Not tried' : b.masteryBest + '%');
        const masteryRow = `<div class="sb-level-row">
            <span class="sb-level-label"><i class="fa-solid ${b.masteryUnlocked ? 'fa-unlock' : 'fa-lock'}" style="font-size:10px;"></i> Mastery</span>
            <div class="sb-level-bar"><div class="sb-level-fill" style="width:${masteryPct}%; background:${masteryColor};"></div></div>
            <span class="sb-level-score">${masteryLabel}</span>
        </div>`;
        return `<div class="sb-card" data-subject="${sanitizeText(b.subject.id)}">
            <div class="sb-top">
                <span class="sb-name">${sanitizeText(b.subject.name)}</span>
                <span class="sb-avg ${avgClass}">${avgLabel}</span>
            </div>
            <div class="sb-levels">${levelsHtml}${masteryRow}</div>
        </div>`;
    }).join('');
}

function buildRecentActivityHTML(recent){
    if(!recent.length){
        return `<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i><h3>No exams yet</h3><p>Take your first exam to start building your history.</p></div>`;
    }
    return recent.map(r => {
        const subj = CPA.SUBJECTS.find(s => s.id === r.subject);
        const topicObj = CPA.getTopic(r.level);
        const lvlLabel = r.level === CPA.MASTERY_TOPIC_ID ? 'Mastery Exam' : (topicObj ? sanitizeText(topicObj.name) : sanitizeText(r.level));
        const dur = r.durationSec || 0;
        const dateStr = new Date(r.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
        const timeStr = new Date(r.date).toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
        return `<div class="ra-row">
            <div class="ra-left">
                <span class="ra-badge ${scoreClass(r.percentage)}">${r.percentage}%</span>
                <div>
                    <div class="ra-title">${subj ? sanitizeText(subj.name) : sanitizeText(r.subject)} · ${lvlLabel}</div>
                    <div class="ra-meta">${r.score}/${r.total} correct · ${Math.floor(dur/60)}m ${dur%60}s</div>
                </div>
            </div>
            <span class="ra-date">${dateStr} · ${timeStr}</span>
        </div>`;
    }).join('');
}

/* ================= EXAM ================= */
function renderExam(subjectId, levelId){
    const subject = CPA.SUBJECTS.find(s => s.id === subjectId);
    const isMastery = levelId === CPA.MASTERY_TOPIC_ID;
    const topic = isMastery ? null : CPA.getTopic(levelId);
    const level = isMastery ? { id:CPA.MASTERY_TOPIC_ID, label:'Mastery Exam' } : (topic ? { id:topic.id, label:topic.name } : null);

    if(!subject || !level || (isMastery && !CPA.isMasteryUnlocked(subjectId))){
        const reason = (subject && isMastery) ? 'The Mastery Exam is still locked for this subject.' : 'Check the link or start again from the dashboard.';
        app.innerHTML = `<div class="exam-shell"><div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Exam not found</h3><p>${reason}</p><button class="btn btn-primary" onclick="location.hash='#/'">Back to Dashboard</button></div></div>`;
        return;
    }

    const { questions, target, available } = CPA.buildExam(subjectId, levelId);

    if(!questions.length){
        app.innerHTML = `<div class="exam-shell"><div class="empty-state"><i class="fa-solid fa-inbox"></i><h3>No questions yet</h3><p>${isMastery ? `No questions have been loaded across ${sanitizeText(subject.name)}'s topics yet.` : `The ${sanitizeText(level.label)} topic for ${sanitizeText(subject.name)} is empty. Add questions in the Question Bank first.`}</p>${isMastery ? '' : `<button class="btn btn-primary" onclick="location.hash='#/admin/${subject.id}/${level.id}'">Go to Question Bank</button>`}</div></div>`;
        return;
    }

    let current = 0;
    const responses = new Array(questions.length).fill(null);
    const startTime = Date.now();

    const timerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(secs/60)).padStart(2,'0');
        const s = String(secs%60).padStart(2,'0');
        const el = document.getElementById('timerDisplay');
        if(el) el.textContent = `${m}:${s}`;
    }, 1000);
    setCleanup(() => clearInterval(timerInterval));

    renderQuestion();

    // A question counts as "answered" once there's a selected choice (mcq)
    // or non-empty text (problem) — used to gate the Next/Submit button.
    function isAnswered(q, given){
        if(q.type === 'problem') return typeof given === 'string' && given.trim().length > 0;
        return given !== null && given !== undefined;
    }

    function renderQuestion(){
        const q = questions[current];
        const pct = Math.round((current / questions.length) * 100);
        const answered = responses[current];
        const answeredNow = isAnswered(q, answered);

        let bodyHtml = '';
        if(q.type === 'problem'){
            const val = answered || '';
            bodyHtml = `<div class="problem-answer-box"><textarea id="problemInput" rows="3" placeholder="Enter your final answer here...">${sanitizeText(val)}</textarea></div>`;
        } else {
            bodyHtml = `<div class="choice-list">` + q.choices.map((choice, i) => `
                <div class="choice ${answered === i ? 'selected' : ''}" tabindex="0" onclick="examSelectChoice(${i})" onkeydown="if(event.key==='Enter')examSelectChoice(${i})">
                    <span class="letter">${String.fromCharCode(65+i)}</span><span>${sanitizeHTML(choice)}</span>
                </div>`).join('') + `</div>`;
        }

        app.innerHTML = `
            <div class="exam-shell">
                <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
                <div class="exam-meta">
                    <span>${sanitizeText(subject.name)} · ${sanitizeText(level.label)} · Question ${current+1} of ${questions.length}${available < target ? ` (bank has ${available}/${target})` : ''}</span>
                    <span class="exam-timer" id="timerDisplay">00:00</span>
                </div>
                <div class="question-card">
                    <span class="q-tag">${q.type === 'problem' ? 'Problem Solving' : 'Multiple Choice'}</span>
                    <div class="q-text">${sanitizeHTML(q.question)}</div>
                    ${bodyHtml}
                </div>
                <div class="exam-nav">
                    <button class="btn btn-outline" id="prevBtn" ${current === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-left"></i> Previous</button>
                    <span class="exam-nav-hint" id="answerHint" style="${answeredNow ? 'visibility:hidden;' : ''}">Answer to continue</span>
                    <button class="btn btn-primary" id="nextBtn" ${answeredNow ? '' : 'disabled'}>${current === questions.length - 1 ? 'Submit Exam' : 'Next'} <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>`;

        if(q.type === 'problem'){
            const input = document.getElementById('problemInput');
            const nextBtn = document.getElementById('nextBtn');
            const hint = document.getElementById('answerHint');
            input.addEventListener('input', e => {
                responses[current] = e.target.value;
                const nowAnswered = isAnswered(q, e.target.value);
                nextBtn.disabled = !nowAnswered;
                if(hint) hint.style.visibility = nowAnswered ? 'hidden' : 'visible';
            });
        }
        document.getElementById('prevBtn').addEventListener('click', () => { current = Math.max(0, current - 1); renderQuestion(); });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if(!isAnswered(q, responses[current])) return; // guard: ignore stray clicks/enter while disabled
            if(current === questions.length - 1) submitExam();
            else { current++; renderQuestion(); }
        });
    }

    window.examSelectChoice = function(i){ responses[current] = i; renderQuestion(); };

    async function submitExam(){
        clearInterval(timerInterval);
        const durationSec = Math.floor((Date.now() - startTime) / 1000);
        let correctCount = 0;
        const review = questions.map((q, i) => {
            let isCorrect;
            if(q.type === 'mcq'){
                isCorrect = responses[i] === q.correctIndex;
            } else {
                const given = (responses[i] || '').trim().toLowerCase();
                const expected = (q.answer || '').trim().toLowerCase();
                isCorrect = given.length > 0 && expected.length > 0 && given === expected;
            }
            if(isCorrect) correctCount++;
            return { q, given:responses[i], isCorrect };
        });
        const percentage = Math.round((correctCount / questions.length) * 100);
        try{
            await CPA.saveResult({ subject:subject.id, level:level.id, score:correctCount, total:questions.length, percentage, durationSec });
        }catch(e){
            console.error('Failed to save result', e);
            alert('Your score couldn\'t be saved to your account, but here it is: ' + percentage + '%. (' + (e.message || 'unknown error') + ')');
        }
        renderResults(review, percentage, correctCount, questions.length, durationSec);
    }

    function verdict(pct){
        if(pct >= 80) return 'Well within board-passing range';
        if(pct >= 60) return 'Getting there — a bit more review';
        return 'Needs focused review';
    }

    function renderResults(review, pct, correct, total, durationSec){
        const m = Math.floor(durationSec/60), s = durationSec%60;
        const ringColor = pct >= 80 ? 'var(--good)' : pct >= 60 ? 'var(--brass)' : 'var(--bad)';

        app.innerHTML = `
        <div class="exam-shell">
            <div class="result-shell">
                <div class="result-ring">
                    <svg width="180" height="180" viewBox="0 0 180 180">
                        <circle cx="90" cy="90" r="78" fill="none" stroke="var(--paper-line)" stroke-width="14"/>
                        <circle cx="90" cy="90" r="78" fill="none" stroke="${ringColor}" stroke-width="14"
                            stroke-dasharray="${2*Math.PI*78}" stroke-dashoffset="${2*Math.PI*78*(1-pct/100)}"
                            stroke-linecap="round" transform="rotate(-90 90 90)"/>
                    </svg>
                    <div class="pct"><span class="num">${pct}%</span><span class="cap">Score</span></div>
                </div>
                <div class="result-verdict">${verdict(pct)}</div>
                <div class="result-detail">${correct} of ${total} correct · ${sanitizeText(subject.name)} · ${sanitizeText(level.label)} · ${m}m ${s}s</div>
                <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
                    <button class="btn btn-outline" onclick="location.hash='#/subject/${subject.id}'"><i class="fa-solid fa-rotate-left"></i> Try Another Topic</button>
                    <button class="btn btn-primary" onclick="location.hash='#/exam/${subject.id}/${level.id}'; router();"><i class="fa-solid fa-arrows-rotate"></i> Retake ${sanitizeText(level.label)}</button>
                </div>
            </div>
            <div class="section-head" style="margin-top:50px;"><div><h2 style="font-size:24px;">Review</h2></div></div>
            <div class="review-list">
                ${review.map((r, i) => `
                    <div class="review-item ${r.isCorrect ? 'correct' : 'incorrect'}">
                        <div class="rq">${i+1}. ${r.q.question}</div>
                        <div class="ra">
                            ${r.q.type === 'mcq'
                                ? `Your answer: <b class="${r.isCorrect ? 'correct-text' : 'wrong-text'}">${r.given !== null ? r.q.choices[r.given] : '(skipped)'}</b>
                                   ${!r.isCorrect ? `&nbsp;·&nbsp; Correct answer: <b class="correct-text">${r.q.choices[r.q.correctIndex]}</b>` : ''}`
                                : `Your answer: <b class="${r.isCorrect ? 'correct-text' : 'wrong-text'}">${r.given || '(skipped)'}</b>
                                   ${!r.isCorrect ? `&nbsp;·&nbsp; Correct answer: <b class="correct-text">${r.q.answer}</b>` : ''}`
                            }
                            ${r.q.explanation ? `<div style="margin-top:6px;">${r.q.explanation}</div>` : ''}
                            ${r.q.type === 'problem' && r.q.solution ? `<div style="margin-top:6px; white-space:pre-wrap;"><i>Solution:</i> ${r.q.solution}</div>` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }
}

                    </div>
                </div>
            </div>`).join('');

        questionListEl.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.edit)));
        questionListEl.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
            if(confirm('Delete this question? This cannot be undone.')){
                try{
                    await CPA.deleteQuestion(btn.dataset.del);
                    refreshAll();
                }catch(e){
                    alert('Delete failed: ' + (e.message || 'unknown error'));
                }
            }
        }));
    }

    function refreshAll(){ renderSidebar(); renderLevelTabs(); renderHeader(); renderQuestions(); }

    searchInput.addEventListener('input', renderQuestions);
    document.getElementById('addQuestionBtn').addEventListener('click', () => openModal());
    document.getElementById('bulkImportBtn').addEventListener('click', () => openBulkImportModal());
    document.getElementById('exportBtn').addEventListener('click', doExport);
    const importFileInput = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', () => doImport(importFileInput));

    function openModal(id){
        if(!activeLevel){ alert('Add a topic first, then you can add questions to it.'); return; }
        editingId = id || null;
        const existing = id ? CPA.getQuestion(id) : null;
        modalType = existing ? existing.type : 'mcq';

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal">
                <h3>${existing ? 'Edit Question' : 'Add Question'}</h3>
                <div class="type-toggle">
                    <button type="button" id="toggleMcq" class="${modalType==='mcq'?'active':''}">Multiple Choice</button>
                    <button type="button" id="toggleProblem" class="${modalType==='problem'?'active':''}">Problem Solving</button>
                </div>
                <div class="form-group">
                    <label>Question</label>
                    <textarea id="fQuestion" rows="3" placeholder="Type the question here...">${existing ? existing.question : ''}</textarea>
                </div>
                <div id="typeFields"></div>
                <div class="form-group">
                    <label>Explanation <span style="text-transform:none; font-weight:400;">(optional, shown after answering)</span></label>
                    <textarea id="fExplanation" rows="2" placeholder="Why this is the correct answer...">${existing ? existing.explanation || '' : ''}</textarea>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" id="cancelModalBtn">Cancel</button>
                    <button class="btn btn-primary" id="saveQuestionBtn">Save Question</button>
                </div>
            </div>`;
        document.body.appendChild(overlay);

        function renderTypeFields(){
            const box = overlay.querySelector('#typeFields');
            if(modalType === 'mcq'){
                const choices = existing && existing.type === 'mcq' ? existing.choices : ['', '', '', ''];
                const correctIndex = existing && existing.type === 'mcq' ? existing.correctIndex : 0;
                box.innerHTML = `
                    <div class="form-group">
                        <label>Choices <span style="text-transform:none; font-weight:400;">(mark the correct one)</span></label>
                        ${choices.map((c, i) => `
                            <div class="choice-input-row">
                                <input type="radio" name="correctChoice" value="${i}" ${i === correctIndex ? 'checked' : ''}>
                                <input type="text" class="choiceText" placeholder="Choice ${String.fromCharCode(65+i)}" value="${c.replace(/"/g,'&quot;')}">
                            </div>`).join('')}
                    </div>`;
            } else {
                box.innerHTML = `
                    <div class="form-group">
                        <label>Correct Final Answer</label>
                        <input type="text" id="fAnswer" placeholder="e.g. 42,500" value="${existing && existing.type === 'problem' ? existing.answer : ''}">
                    </div>
                    <div class="form-group">
                        <label>Solution / Steps <span style="text-transform:none; font-weight:400;">(optional, shown after answering)</span></label>
                        <textarea id="fSolution" rows="4" placeholder="Step-by-step working...">${existing && existing.type === 'problem' ? existing.solution || '' : ''}</textarea>
                    </div>`;
            }
        }
        renderTypeFields();

        overlay.querySelector('#toggleMcq').addEventListener('click', () => {
            modalType = 'mcq';
            overlay.querySelector('#toggleMcq').classList.add('active');
            overlay.querySelector('#toggleProblem').classList.remove('active');
            renderTypeFields();
        });
        overlay.querySelector('#toggleProblem').addEventListener('click', () => {
            modalType = 'problem';
            overlay.querySelector('#toggleProblem').classList.add('active');
            overlay.querySelector('#toggleMcq').classList.remove('active');
            renderTypeFields();
        });
        overlay.querySelector('#cancelModalBtn').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
        overlay.querySelector('#saveQuestionBtn').addEventListener('click', () => saveQuestion(overlay));
    }

    async function saveQuestion(overlay){
        const questionText = overlay.querySelector('#fQuestion').value.trim();
        if(!questionText){ alert('Please enter the question text.'); return; }

        let payload = { subject:activeSubject, level:activeLevel, type:modalType, question:questionText,
            explanation: overlay.querySelector('#fExplanation').value.trim() };

        if(modalType === 'mcq'){
            const texts = Array.from(overlay.querySelectorAll('.choiceText')).map(i => i.value.trim());
            if(texts.some(t => !t)){ alert('Please fill in all four choices.'); return; }
            const correctRadio = overlay.querySelector('input[name="correctChoice"]:checked');
            if(!correctRadio){ alert('Please mark the correct choice.'); return; }
            payload.choices = texts;
            payload.correctIndex = parseInt(correctRadio.value, 10);
        } else {
            const answer = overlay.querySelector('#fAnswer').value.trim();
            if(!answer){ alert('Please enter the correct final answer.'); return; }
            payload.answer = answer;
            payload.solution = overlay.querySelector('#fSolution').value.trim();
        }

        const saveBtn = overlay.querySelector('#saveQuestionBtn');
        saveBtn.disabled = true;
        try{
            if(editingId) await CPA.updateQuestion(editingId, payload);
            else await CPA.addQuestion(payload);
            overlay.remove();
            refreshAll();
        }catch(e){
            saveBtn.disabled = false;
            alert('Save failed: ' + (e.message || 'unknown error'));
        }
    }

    /* ---------------- Bulk Import ---------------- */
    function openBulkImportModal(){
        let bulkFormat = 'csv'; // 'csv' | 'json'
        let loadedText = '';
        let loadedFileName = '';

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal modal-wide">
                <h3>Bulk Import Questions</h3>
                <div class="bulk-help">
                    Upload or paste many questions at once instead of adding them one by one.
                    Any row that doesn't specify its own <code>subject</code> / <code>topic</code> will use the defaults below.
                    <br><a id="downloadTemplateLink">Download a starter CSV template</a>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Default Subject</label>
                        <select id="bulkDefaultSubject">
                            ${CPA.SUBJECTS.map(s => `<option value="${s.id}" ${s.id === activeSubject ? 'selected' : ''}>${s.id} — ${s.full}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Default Topic</label>
                        <select id="bulkDefaultLevel"></select>
                    </div>
                </div>

                <div class="bulk-format-toggle">
                    <button type="button" id="bulkFormatCsv" class="active">CSV</button>
                    <button type="button" id="bulkFormatJson">JSON</button>
                </div>

                <div id="bulkHelpText" class="bulk-help">
                    CSV columns: <code>type</code>, <code>question</code>, <code>choiceA</code>, <code>choiceB</code>, <code>choiceC</code>, <code>choiceD</code>, <code>correct</code>, <code>answer</code>, <code>solution</code>, <code>explanation</code>, <code>subject</code>, <code>topic</code>.
                    Use <code>type=mcq</code> with choices + <code>correct</code> (A/B/C/D, or 1-4), or <code>type=problem</code> with <code>answer</code> (+ optional <code>solution</code>). <code>subject</code>/<code>topic</code> columns are optional if you set defaults above — <code>topic</code> must match an existing topic's name exactly.
                </div>

                <div class="bulk-drop" id="bulkDrop">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <div>Drop a .csv or .json file here, or click to choose one</div>
                    <div class="fname" id="bulkFileName"></div>
                </div>
                <input type="file" id="bulkFileInput" accept=".csv,.json,application/json,text/csv" style="display:none;">

                <div class="form-group" style="margin-top:16px;">
                    <label>...or paste it directly</label>
                    <textarea id="bulkPasteArea" rows="6" placeholder="Paste CSV rows or a JSON array of questions here"></textarea>
                </div>

                <div id="bulkReport"></div>

                <div class="modal-actions">
                    <button class="btn btn-outline" id="bulkCancelBtn">Cancel</button>
                    <button class="btn btn-primary" id="bulkImportRunBtn"><i class="fa-solid fa-file-import"></i> Import Questions</button>
                </div>
            </div>`;
        document.body.appendChild(overlay);

        const subjectSelect = overlay.querySelector('#bulkDefaultSubject');
        const topicSelect = overlay.querySelector('#bulkDefaultLevel');
        function refreshTopicOptions(){
            const topics = CPA.getTopics(subjectSelect.value);
            topicSelect.innerHTML = topics.length
                ? topics.map(t => `<option value="${t.id}" ${t.id === activeLevel ? 'selected' : ''}>${t.name}</option>`).join('')
                : `<option value="" disabled selected>No topics yet — add one first</option>`;
        }
        refreshTopicOptions();
        subjectSelect.addEventListener('change', refreshTopicOptions);

        const dropZone = overlay.querySelector('#bulkDrop');
        const fileInput = overlay.querySelector('#bulkFileInput');
        const fileNameEl = overlay.querySelector('#bulkFileName');
        const pasteArea = overlay.querySelector('#bulkPasteArea');
        const reportEl = overlay.querySelector('#bulkReport');
        const helpTextEl = overlay.querySelector('#bulkHelpText');

        function setFormat(fmt){
            bulkFormat = fmt;
            overlay.querySelector('#bulkFormatCsv').classList.toggle('active', fmt === 'csv');
            overlay.querySelector('#bulkFormatJson').classList.toggle('active', fmt === 'json');
            helpTextEl.innerHTML = fmt === 'csv'
                ? `CSV columns: <code>type</code>, <code>question</code>, <code>choiceA</code>, <code>choiceB</code>, <code>choiceC</code>, <code>choiceD</code>, <code>correct</code>, <code>answer</code>, <code>solution</code>, <code>explanation</code>, <code>subject</code>, <code>topic</code>.
                   Use <code>type=mcq</code> with choices + <code>correct</code> (A/B/C/D, or 1-4), or <code>type=problem</code> with <code>answer</code> (+ optional <code>solution</code>). <code>subject</code>/<code>topic</code> columns are optional if you set defaults above — <code>topic</code> must match an existing topic's name exactly.`
                : `JSON: an array of objects, each with <code>type</code> ("mcq" or "problem"), <code>question</code>, and either <code>choices</code> (array) + <code>correctIndex</code> for MCQ, or <code>answer</code> (+ optional <code>solution</code>) for problem-solving. <code>subject</code>/<code>topic</code> per item are optional if you set defaults above — <code>topic</code> must match an existing topic's name exactly.`;
        }
        overlay.querySelector('#bulkFormatCsv').addEventListener('click', () => setFormat('csv'));
        overlay.querySelector('#bulkFormatJson').addEventListener('click', () => setFormat('json'));

        overlay.querySelector('#downloadTemplateLink').addEventListener('click', () => {
            const exampleTopic = topicSelect.value || 'Replace with an existing topic name';
            const template = 'type,question,choiceA,choiceB,choiceC,choiceD,correct,answer,solution,explanation,subject,topic\n' +
                `mcq,"Which financial statement reports a company's assets, liabilities, and equity?","Income Statement","Balance Sheet","Statement of Cash Flows","Statement of Retained Earnings",B,,,"The balance sheet shows financial position at a point in time.",${subjectSelect.value},"${exampleTopic}"\n` +
                `problem,"A company has assets of 500,000 and liabilities of 200,000. What is total equity?",,,,, ,300000,"Equity = Assets - Liabilities = 500,000 - 200,000",,${subjectSelect.value},"${exampleTopic}"\n`;
            const blob = new Blob([template], { type:'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'cpa-bulk-import-template.csv'; a.click();
            URL.revokeObjectURL(url);
        });

        function handleFile(file){
            if(!file) return;
            loadedFileName = file.name;
            fileNameEl.textContent = file.name;
            if(/\.json$/i.test(file.name)) setFormat('json');
            else if(/\.csv$/i.test(file.name)) setFormat('csv');
            const reader = new FileReader();
            reader.onload = () => { loadedText = reader.result; pasteArea.value = loadedText; };
            reader.readAsText(file);
        }
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
        ['dragenter','dragover'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
        ['dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
        dropZone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) handleFile(f); });

        overlay.querySelector('#bulkCancelBtn').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });

        overlay.querySelector('#bulkImportRunBtn').addEventListener('click', async () => {
            const text = pasteArea.value.trim();
            if(!text){ reportEl.innerHTML = `<div class="bulk-report has-errors">Please choose a file or paste some data first.</div>`; return; }

            const defaults = {
                subject: overlay.querySelector('#bulkDefaultSubject').value,
                level: overlay.querySelector('#bulkDefaultLevel').value
            };

            let rows;
            try{
                if(bulkFormat === 'json'){
                    const parsed = JSON.parse(text);
                    rows = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.questions) ? parsed.questions : null);
                    if(!rows) throw new Error('Expected a JSON array of question objects (or {"questions":[...]})');
                } else {
                    rows = CPA.parseCSV(text);
                    if(!rows.length) throw new Error('No data rows found — make sure the first line is a header row.');
                }
            }catch(e){
                reportEl.innerHTML = `<div class="bulk-report has-errors"><b>Couldn't read that data:</b> ${e.message}</div>`;
                return;
            }

            const runBtn = overlay.querySelector('#bulkImportRunBtn');
            runBtn.disabled = true;
            runBtn.textContent = 'Importing...';
            const { added, errors } = await CPA.bulkAddQuestions(rows, defaults);
            runBtn.disabled = false;
            runBtn.innerHTML = '<i class="fa-solid fa-file-import"></i> Import Questions';

            let html = `<div class="bulk-report ${errors.length ? 'has-errors' : ''}">`;
            html += `<b>${added.length} question${added.length === 1 ? '' : 's'} imported${errors.length ? `, ${errors.length} skipped` : ''}.</b>`;
            if(errors.length){
                html += `<ul>` + errors.slice(0, 20).map(e => `<li>Row ${e.row}: ${e.message}</li>`).join('') + `</ul>`;
                if(errors.length > 20) html += `<div style="margin-top:6px;">...and ${errors.length - 20} more.</div>`;
            }
            html += `</div>`;
            reportEl.innerHTML = html;

            if(added.length){
                refreshAll();
            }
        });
    }

    function doExport(){
        const blob = new Blob([CPA.exportData()], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cpa-question-bank-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function doImport(input){
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
            const mode = confirm('Click OK to MERGE with existing questions, or Cancel to REPLACE the entire bank.') ? 'merge' : 'replace';
            try{
                await CPA.importData(reader.result, mode);
                refreshAll();
                alert('Import complete.');
            }catch(e){
                alert('Import failed: ' + e.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    refreshAll();
}

</script>
</body>
</html>
